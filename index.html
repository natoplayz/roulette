<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#123b12">
<title>European Roulette</title>
<style>
:root{--felt:#176018;--felt2:#0d430f;--line:#e4e6d4;--gold:#e6c36d;--red:#bd3028;--black:#263326}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 25%,#397d19,#123b12 72%);color:#f4f3e7;font-family:Arial,Helvetica,sans-serif;min-height:100vh;padding:12px}
.app{max-width:1000px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.counter{background:#092d0bcc;border:1px solid #ffffff25;border-radius:8px;padding:10px 13px;min-width:130px;font-weight:bold}.counter small{display:block;color:#a9c79c;font-size:10px;letter-spacing:1px}.counter strong{font-size:clamp(18px,4vw,26px)}.title{font-weight:900;letter-spacing:2px;color:#d5e5c4;font-size:clamp(15px,3.6vw,22px)}
.panel{background:#0c3c10a8;border:1px solid #ffffff20;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 7px 18px #061d0866}
.board-scroll{width:100%;overflow:visible}.board{width:100%;display:grid;grid-template-columns:30px repeat(12,minmax(0,1fr)) 30px;grid-template-rows:repeat(3,clamp(43px,12vw,68px));gap:2px}
.cell{position:relative;border:1px solid #d9ddc8;background:var(--black);color:#f7f3e8;font-size:clamp(10px,3.2vw,23px);font-weight:800;display:flex;align-items:center;justify-content:center;cursor:pointer;min-width:0;border-radius:1px;touch-action:manipulation}
.cell.red{background:var(--red)}.cell.black{background:#263326}.cell.green{background:#078b42}.cell:active,.outside:active{filter:brightness(1.3)}.zero{grid-column:1;grid-row:1/4;font-size:28px;clip-path:polygon(20% 0,100% 0,100% 100%,20% 100%,0 50%);border:0;outline:2px solid #e2e5d1}
.colbet{font-size:12px;background:#145519}.cell .badge{position:absolute;bottom:1px;right:2px;border-radius:10px;background:#f1d16e;color:#171b10;font-size:10px;padding:1px 4px}
.outside-row{width:calc(100% - 62px);margin-left:32px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin-top:2px}.outside-row.six{grid-template-columns:repeat(6,minmax(0,1fr))}.outside{position:relative;background:#15551b;border:1px solid var(--line);color:#f5f2e4;font-weight:800;padding:9px 1px;text-align:center;font-size:clamp(8px,2.5vw,17px);min-height:42px;cursor:pointer;touch-action:manipulation}.outside.red{background:var(--red)}.outside.black{background:#263326}.outside .badge{display:block;color:#ffdf84;font-size:10px}
.chipbar{display:flex;align-items:center;justify-content:center;gap:clamp(7px,2vw,17px);flex-wrap:wrap;padding:10px 0}.chip{width:clamp(44px,11vw,62px);height:clamp(44px,11vw,62px);border-radius:50%;border:5px dashed #eee9d9;box-shadow:0 4px 6px #0009,inset 0 0 0 3px #ffffff45;color:white;font-size:clamp(12px,2.5vw,17px);font-weight:900;text-shadow:0 1px 2px #000;cursor:pointer}.chip.sel{outline:3px solid #f5e28e;outline-offset:3px;transform:translateY(-3px)}.v1{background:#188d55}.v5{background:#c72e31}.v25{background:#256eae}.v100{background:#9a4d9c}.v500{background:#222}.v1000{background:#bd2532}
.controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.btn,select{border:1px solid #6b9a5b;border-radius:8px;background:linear-gradient(#155d22,#07380e);color:#f5f5e8;padding:11px 14px;font-weight:900;cursor:pointer;touch-action:manipulation}.btn.primary{background:linear-gradient(#54d94d,#139a27);border:2px solid #7ee46c;font-size:clamp(21px,5vw,34px);padding:14px 34px;min-width:145px}.btn:disabled{opacity:.45}.toggle{display:flex;background:#082c0c;border:1px solid #6b9a5b;border-radius:9px;padding:3px}.toggle button{background:transparent;border:0;color:#dce9d6;padding:9px 12px;font-weight:900;border-radius:6px}.toggle button.active{background:#70b84b;color:#102b0c}
select{max-width:100%;padding:10px}.status{text-align:center;color:#d0e0c5;font-size:12px;min-height:18px;margin-top:8px}.resultline{display:flex;justify-content:center;align-items:center;gap:12px;margin:4px 0 12px}.result-ball{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#111;border:3px solid #e4c66f;font-size:21px;font-weight:900}.resulttext{font-size:14px;color:#e8d38b;font-weight:bold;text-align:center}.history{display:flex;justify-content:center;gap:5px;flex-wrap:wrap;margin-top:8px}.hist{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:bold;border:1px solid #ffffff55}
.wheelbox{display:none;align-items:center;justify-content:center;gap:18px;flex-wrap:wrap;padding:10px}.wheel{width:min(68vw,290px);aspect-ratio:1;border-radius:50%;border:12px solid #c79b48;background:repeating-conic-gradient(#9b3817 0 10deg,#a94a1b 10deg 20deg);box-shadow:inset 0 0 0 5px #f1d58b,0 6px 18px #0009;display:grid;place-items:center;position:relative}.wheel:before{content:"";position:absolute;inset:14%;border-radius:50%;background:repeating-conic-gradient(#182019 0 9.73deg,#b32c2b 9.73deg 19.46deg);border:5px solid #e5c36f}.wheel:after{content:"";position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,#f5d86b 0 8%,#946321 9% 18%,#452c12 19% 100%);border:5px solid #e5c36f}.wheel.spin{animation:wheelspin 1.05s cubic-bezier(.12,.72,.18,1)}@keyframes wheelspin{from{transform:rotate(0)}to{transform:rotate(1260deg)}}.wheelnum{z-index:2;font-size:34px;font-weight:900;text-shadow:0 2px 4px #000}
@media(max-width:540px){body{padding:7px}.panel{padding:8px}.counter{min-width:78px;padding:7px}.board{grid-template-columns:25px repeat(12,minmax(0,1fr)) 25px;grid-template-rows:repeat(3,48px);gap:1px}.cell{font-size:clamp(9px,3.1vw,14px);padding:0}.zero{font-size:17px}.colbet{font-size:8px}.outside-row{width:calc(100% - 52px);margin-left:26px}.outside{font-size:clamp(7px,2.2vw,11px);min-height:37px;padding:6px 0}.top{gap:5px}.title{letter-spacing:1px;font-size:13px}}
</style>
</head>
<body>
<div class="app">
 <header class="top">
  <div class="counter"><small>TOTAL</small><strong id="balance">8,900</strong></div>
  <div class="title">EUROPEAN ROULETTE</div>
  <div class="counter"><small>BET</small><strong id="betTotal">0</strong></div>
 </header>
 <section class="panel">
  <div class="resultline"><div class="result-ball" id="resultBall">—</div><div class="resulttext" id="resultText">PLACE YOUR BETS</div></div>
  <div class="board-scroll"><div class="board" id="board"><button class="cell green zero" data-number="0">0</button><button class="cell number red" data-number="3" style="grid-row:1;grid-column:2">3</button><button class="cell number black" data-number="6" style="grid-row:1;grid-column:3">6</button><button class="cell number red" data-number="9" style="grid-row:1;grid-column:4">9</button><button class="cell number red" data-number="12" style="grid-row:1;grid-column:5">12</button><button class="cell number black" data-number="15" style="grid-row:1;grid-column:6">15</button><button class="cell number red" data-number="18" style="grid-row:1;grid-column:7">18</button><button class="cell number red" data-number="21" style="grid-row:1;grid-column:8">21</button><button class="cell number black" data-number="24" style="grid-row:1;grid-column:9">24</button><button class="cell number red" data-number="27" style="grid-row:1;grid-column:10">27</button><button class="cell number red" data-number="30" style="grid-row:1;grid-column:11">30</button><button class="cell number black" data-number="33" style="grid-row:1;grid-column:12">33</button><button class="cell number red" data-number="36" style="grid-row:1;grid-column:13">36</button><button class="cell number black" data-number="2" style="grid-row:2;grid-column:2">2</button><button class="cell number red" data-number="5" style="grid-row:2;grid-column:3">5</button><button class="cell number black" data-number="8" style="grid-row:2;grid-column:4">8</button><button class="cell number black" data-number="11" style="grid-row:2;grid-column:5">11</button><button class="cell number red" data-number="14" style="grid-row:2;grid-column:6">14</button><button class="cell number black" data-number="17" style="grid-row:2;grid-column:7">17</button><button class="cell number black" data-number="20" style="grid-row:2;grid-column:8">20</button><button class="cell number red" data-number="23" style="grid-row:2;grid-column:9">23</button><button class="cell number black" data-number="26" style="grid-row:2;grid-column:10">26</button><button class="cell number black" data-number="29" style="grid-row:2;grid-column:11">29</button><button class="cell number red" data-number="32" style="grid-row:2;grid-column:12">32</button><button class="cell number black" data-number="35" style="grid-row:2;grid-column:13">35</button><button class="cell number red" data-number="1" style="grid-row:3;grid-column:2">1</button><button class="cell number black" data-number="4" style="grid-row:3;grid-column:3">4</button><button class="cell number red" data-number="7" style="grid-row:3;grid-column:4">7</button><button class="cell number black" data-number="10" style="grid-row:3;grid-column:5">10</button><button class="cell number black" data-number="13" style="grid-row:3;grid-column:6">13</button><button class="cell number red" data-number="16" style="grid-row:3;grid-column:7">16</button><button class="cell number red" data-number="19" style="grid-row:3;grid-column:8">19</button><button class="cell number black" data-number="22" style="grid-row:3;grid-column:9">22</button><button class="cell number red" data-number="25" style="grid-row:3;grid-column:10">25</button><button class="cell number black" data-number="28" style="grid-row:3;grid-column:11">28</button><button class="cell number black" data-number="31" style="grid-row:3;grid-column:12">31</button><button class="cell number red" data-number="34" style="grid-row:3;grid-column:13">34</button><button class="cell colbet" data-col="1" style="grid-column:14;grid-row:1">2 TO 1</button><button class="cell colbet" data-col="2" style="grid-column:14;grid-row:2">2 TO 1</button><button class="cell colbet" data-col="3" style="grid-column:14;grid-row:3">2 TO 1</button></div>
  <div class="outside-row" id="dozens">
   <button class="outside" data-bet="dozen1">1ST 12<span class="badge"></span></button><button class="outside" data-bet="dozen2">2ND 12<span class="badge"></span></button><button class="outside" data-bet="dozen3">3RD 12<span class="badge"></span></button>
  </div>
  <div class="outside-row six">
   <button class="outside" data-bet="low">1 TO 18<span class="badge"></span></button><button class="outside" data-bet="even">EVEN<span class="badge"></span></button><button class="outside red" data-bet="red">◆<span class="badge"></span></button><button class="outside black" data-bet="black">◆<span class="badge"></span></button><button class="outside" data-bet="odd">ODD<span class="badge"></span></button><button class="outside" data-bet="high">19 TO 36<span class="badge"></span></button>
  </div>
  <div class="outside-row" id="columns">
   <button class="outside" data-bet="col1">2 TO 1 · COLUMN 1<span class="badge"></span></button><button class="outside" data-bet="col2">2 TO 1 · COLUMN 2<span class="badge"></span></button><button class="outside" data-bet="col3">2 TO 1 · COLUMN 3<span class="badge"></span></button>
  </div></div>
 </section>
 <section class="panel">
  <div class="chipbar" id="chips">
   <button class="chip v1 sel" data-chip="1">1</button><button class="chip v5" data-chip="5">5</button><button class="chip v25" data-chip="25">25</button><button class="chip v100" data-chip="100">100</button><button class="chip v500" data-chip="500">500</button><button class="chip v1000" data-chip="1000">1K</button>
  </div>
  <div class="controls">
   <select id="betType" aria-label="Inside bet type"><option value="straight">Straight up</option><option value="split">Split (choose 2 touching numbers)</option><option value="street">Street (choose 3 in a column)</option><option value="corner">Corner (choose 4 touching numbers)</option><option value="sixline">Six line (choose 6 in 2 columns)</option></select>
   <button class="btn" id="undo">↶ UNDO</button><button class="btn" id="repeat">REPEAT BET</button><button class="btn" id="clear">✕ CLEAR BET</button>
  </div>
  <div class="controls" style="margin-top:10px">
   <div class="toggle"><button id="normal" class="active">▶ NORMAL</button><button id="fast">▶▶ QUICK SPIN</button></div>
   <button class="btn primary" id="spin">SPIN</button>
  </div>
  <div class="wheelbox" id="wheelbox"><div class="wheel" id="wheel"><span class="wheelnum" id="wheelnum">0</span></div></div>
  <div class="status" id="status">Choose a chip, then tap a number or betting area.</div>
  <div class="history" id="history"></div>
 </section>
</div>
<script>
'use strict';
const RED=new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
const $=id=>document.getElementById(id);
let balance=8900,chip=1,bets=[],previous=[],selected=[],mode='normal',history=[];
const coords={};
for(let n=1;n<=36;n++){let col=Math.floor((n-1)/3),row=2-((n-1)%3);coords[n]={r:row,c:col};}
document.querySelectorAll('.number').forEach(el=>el.addEventListener('click',()=>numberTap(+el.dataset.number)));
document.querySelectorAll('[data-col]').forEach(el=>el.addEventListener('click',()=>outsideTap('col'+el.dataset.col)));
$('chips').addEventListener('click',e=>{let b=e.target.closest('[data-chip]');if(!b)return;chip=+b.dataset.chip;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('sel',x===b));});
$('betType').addEventListener('change',()=>{selected=[];status();});
document.querySelectorAll('[data-bet]').forEach(b=>b.addEventListener('click',()=>outsideTap(b.dataset.bet)));
function stake(){return bets.reduce((s,b)=>s+b.amount,0)}
function addBet(type,nums=[]){if(stake()+chip>balance){$('status').textContent='Not enough credits.';return;}bets.push({type,nums:[...nums],amount:chip});selected=[];drawBets();}
function numberTap(n){
 const type=$('betType').value;
 if(type==='straight'){addBet(type,[n]);return;}
 selected.push(n);
 const needed={split:2,street:3,corner:4,sixline:6}[type];
 if(selected.length<needed){status();return;}
 const nums=[...new Set(selected)].sort((a,b)=>a-b);
 if(nums.length===needed&&valid(type,nums))addBet(type,nums);
 else{$('status').textContent='Invalid combination. Select a valid '+type+' again.';selected=[];status();}
}
function valid(type,a){
 if(type==='split'){
  if(a.length!==2)return false;
  if(a[0]===0)return a[1]===1||a[1]===2||a[1]===3;
  let x=coords[a[0]],y=coords[a[1]];
  return Math.abs(x.r-y.r)+Math.abs(x.c-y.c)===1;
 }
 if(type==='street')return a.length===3&&a[0]>0&&a[2]-a[0]===2&&Math.floor((a[0]-1)/3)===Math.floor((a[2]-1)/3);
 if(type==='corner'){
  if(a.length!==4||a[0]===0)return false;
  let cs=a.map(n=>coords[n]),rs=cs.map(x=>x.r),cols=cs.map(x=>x.c);
  return Math.max(...rs)-Math.min(...rs)===1&&Math.max(...cols)-Math.min(...cols)===1&&new Set(rs).size===2&&new Set(cols).size===2;
 }
 if(type==='sixline')return a.length===6&&a[0]>0&&a[5]-a[0]===5&&Math.floor((a[0]-1)/3)===Math.floor((a[2]-1)/3)&&Math.floor((a[3]-1)/3)===Math.floor((a[5]-1)/3);
 return false;
}
function outsideTap(type){addBet(type,[])}
function status(){
 let need={split:2,street:3,corner:4,sixline:6}[$('betType').value]||1;
 $('status').textContent=selected.length?`Select ${need-selected.length} more number(s) for ${$('betType').value}.`:`${bets.length} placed bet(s) · ${stake()} credits staked.`;
}
function drawBets(){
 $('balance').textContent=balance.toLocaleString();$('betTotal').textContent=stake().toLocaleString();
 document.querySelectorAll('.number,.zero').forEach(el=>{let n=+el.dataset.number,amt=bets.filter(b=>b.nums.includes(n)).reduce((s,b)=>s+b.amount,0);let badge=el.querySelector('.badge');if(!badge){badge=document.createElement('span');badge.className='badge';el.appendChild(badge)}badge.textContent=amt||'';});
 document.querySelectorAll('[data-bet]').forEach(el=>{let amt=bets.filter(b=>b.type===el.dataset.bet).reduce((s,b)=>s+b.amount,0);el.querySelector('.badge').textContent=amt?amt+' chips':'';});
 $('spin').disabled=!bets.length||stake()>balance;$('undo').disabled=!bets.length;status();
}
$('undo').onclick=()=>{bets.pop();drawBets()};
$('clear').onclick=()=>{bets=[];selected=[];drawBets()};
$('repeat').onclick=()=>{if(!previous.length)return;let total=previous.reduce((s,b)=>s+b.amount,0);if(total>balance){$('status').textContent='Not enough credits to repeat.';return;}bets=previous.map(b=>({...b,nums:[...b.nums]}));drawBets()};
$('normal').onclick=()=>setMode('normal');$('fast').onclick=()=>setMode('fast');
function setMode(m){mode=m;$('normal').classList.toggle('active',m==='normal');$('fast').classList.toggle('active',m==='fast');$('wheelbox').style.display='none'}
function multiplier(b,n){
 if(b.type==='straight')return b.nums.includes(n)?35:0;
 if(b.type==='split')return b.nums.includes(n)?17:0;
 if(b.type==='street')return b.nums.includes(n)?11:0;
 if(b.type==='corner')return b.nums.includes(n)?8:0;
 if(b.type==='sixline')return b.nums.includes(n)?5:0;
 if(n===0)return 0;
 if(b.type==='red')return RED.has(n)?1:0;if(b.type==='black')return !RED.has(n)?1:0;
 if(b.type==='even')return n%2===0?1:0;if(b.type==='odd')return n%2?1:0;
 if(b.type==='low')return n<=18?1:0;if(b.type==='high')return n>=19?1:0;
 if(b.type==='dozen1')return n<=12?2:0;if(b.type==='dozen2')return n>=13&&n<=24?2:0;if(b.type==='dozen3')return n>=25?2:0;
 if(b.type==='col1')return n%3===1?2:0;if(b.type==='col2')return n%3===2?2:0;if(b.type==='col3')return n%3===0?2:0;return 0;
}
function finish(n,staked){
 let returned=0;for(const b of bets){let m=multiplier(b,n);if(m)returned+=b.amount*(m+1);}
 balance+=returned;
 let net=returned-staked;
 $('resultBall').textContent=n;$('resultBall').style.background=n===0?'#078b42':RED.has(n)?'#bd3028':'#263326';
 $('resultText').textContent=(n===0?'GREEN ZERO':RED.has(n)?'RED':'BLACK')+' · '+(net>=0?'WON ':'LOST ')+Math.abs(net).toLocaleString()+' credits';
 history.unshift(n);history=history.slice(0,12);$('history').innerHTML=history.map(x=>`<span class="hist" style="background:${x===0?'#078b42':RED.has(x)?'#bd3028':'#263326'}">${x}</span>`).join('');
 bets=[];selected=[];drawBets();
}
$('spin').onclick=()=>{
 const staked=stake();if(!staked||staked>balance)return;
 balance-=staked;previous=bets.map(b=>({...b,nums:[...b.nums]}));$('balance').textContent=balance.toLocaleString();$('spin').disabled=true;
 const n=Math.floor(Math.random()*37);
 if(mode==='fast'){finish(n,staked);}
 else{
  $('wheelbox').style.display='flex';$('wheel').classList.remove('spin');void $('wheel').offsetWidth;$('wheel').classList.add('spin');
  $('wheelnum').textContent='•';setTimeout(()=>{$('wheelnum').textContent=n;$('wheelnum').style.color=n===0?'#58ee8a':RED.has(n)?'#ff7676':'white';finish(n,staked);},1100);
 }
};
drawBets();
</script>
</body></html>
